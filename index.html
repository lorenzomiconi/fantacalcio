        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        select { background-color: #1e293b !important; color: #f8fafc !important; }

        .football-pitch {
            background: linear-gradient(180deg, #15803d 0%, #166534 50%, #15803d 100%);
            position: relative;
            border: 4px solid #ffffff;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            width: 100%;
            min-height: 700px;
        }
        .pitch-midline { position: absolute; top: 50%; left: 0; right: 0; height: 3px; background-color: rgba(255, 255, 255, 0.6); pointer-events: none; }
        .pitch-center-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; border: 3px solid rgba(255, 255, 255, 0.6); border-radius: 50%; pointer-events: none; }
        .pitch-center-spot { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; background-color: rgba(255, 255, 255, 0.8); border-radius: 50%; pointer-events: none; }
        .pitch-box-bottom { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 55%; height: 95px; border: 3px solid rgba(255, 255, 255, 0.6); border-bottom: none; pointer-events: none; }
        .pitch-goalbox-bottom { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 25%; height: 35px; border: 3px solid rgba(255, 255, 255, 0.6); border-bottom: none; pointer-events: none; }
        .goal-bottom { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 130px; height: 14px; border: 3px dashed rgba(255, 255, 255, 0.9); background: rgba(0, 0, 0, 0.25); pointer-events: none; z-index: 5; }
        .pitch-box-top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 55%; height: 95px; border: 3px solid rgba(255, 255, 255, 0.6); border-top: none; pointer-events: none; }
        .pitch-goalbox-top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 25%; height: 35px; border: 3px solid rgba(255, 255, 255, 0.6); border-top: none; pointer-events: none; }
        .goal-top { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 130px; height: 14px; border: 3px dashed rgba(255, 255, 255, 0.9); background: rgba(0, 0, 0, 0.25); pointer-events: none; z-index: 5; }
    </style>

                {home: "NAPOLI", away: "MONZA"}, {home: "PARMA", away: "MILAN"}, {home: "SASSUOLO", away: "LECCE"}, {home: "TORINO", away: "GENOA"}
            ],
            35: [
                {home: "BOLOGNA", away: "PARMA"}, {home: "GENOA", away: "FROSINONE"}, {home: "INTER", away: "ATALANTA"},
                {home: "LECCE", away: "TORINO"}, {home: "MILAN", away: "VENEZIA"}, {home: "ROMA", away: "LAZIO"},
                {home: "UDINESE", away: "JUVENTUS"}, {home: "VERONA", away: "SASSUOLO"}, {home: "MONZA", away: "CAGLIARI"}, {home: "COMO", away: "NAPOLI"}
            ],
            36: [
                {home: "ATALANTA", away: "MILAN"}, {home: "CAGLIARI", away: "NAPOLI"}, {home: "FROSINONE", away: "INTER"},
                {home: "JUVENTUS", away: "MONZA"}, {home: "LAZIO", away: "FIORENTINA"}, {home: "PARMA", away: "ROMA"},
                {home: "SASSUOLO", away: "BOLOGNA"}, {home: "TORINO", away: "VERONA"}, {home: "UDINESE", away: "GENOA"}, {home: "VENEZIA", away: "LECCE"}
            ],
            37: [
                {home: "BOLOGNA", away: "UDINESE"}, {home: "COMO", away: "ATALANTA"}, {home: "GENOA", away: "TORINO"},
                {home: "INTER", away: "VERONA"}, {home: "LECCE", away: "FROSINONE"}, {home: "MILAN", away: "MONZA"},
                {home: "NAPOLI", away: "JUVENTUS"}, {home: "ROMA", away: "CAGLIARI"}, {home: "SASSUOLO", away: "LAZIO"}, {home: "VENEZIA", away: "PARMA"}
            ],
            38: [
                {home: "ATALANTA", away: "COMO"}, {home: "CAGLIARI", away: "MILAN"}, {home: "FROSINONE", away: "LECCE"},
                {home: "JUVENTUS", away: "INTER"}, {home: "LAZIO", away: "ROMA"}, {home: "PARMA", away: "BOLOGNA"},
                {home: "SASSUOLO", away: "GENOA"}, {home: "TORINO", away: "NAPOLI"}, {home: "UDINESE", away: "MONZA"}, {home: "VERONA", away: "VENEZIA"}
            ]
        };

        async function loadData() {
            try {
                const response = await fetch('data.json');
                leagueData = await response.json();
                initDashboard();
            } catch (error) {
                console.error("Errore nel caricamento di data.json:", error);
            }
        }

        function initDashboard() {
            const giornataSelect = document.getElementById('giornataSelect');
            if (giornataSelect && giornataSelect.options.length === 0) {
                for (let i = 1; i <= 38; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = `${i}ª Giornata`;
                    if (i === 12) opt.selected = true;
                    giornataSelect.appendChild(opt);
                }
            }

            const teamSelect = document.getElementById('teamSelect');
            if (teamSelect && teamSelect.options.length === 0) {
                Object.keys(leagueData).forEach(team => {
                    const opt1 = document.createElement('option');
                    opt1.value = team; opt1.textContent = team;
                    teamSelect.appendChild(opt1);
                });
            }

            const savedModulo = localStorage.getItem('cascina_modulo');
            if (savedModulo) {
                document.getElementById('moduloSelect').value = savedModulo;
            }

            initCustomLineupSelectors();
            updateAll();
        }

        function updateAll() {
            renderTeam();
            updateCustomLineupStats();
            // Aggiorna anche le etichette delle partite sul campo se cambia giornata
            initCustomLineupSelectors();
        }

        function getMatchDetails(p, giornata) {
            if (!p || !p.squadra) return { avversario: "-", isHome: false };
            let squadraKey = p.squadra.toUpperCase().trim();
            const partiteGiornata = calendarioUfficiale[giornata] || [];
            for (let match of partiteGiornata) {
                if (match.home === squadraKey) return { avversario: match.away, isHome: true };
                if (match.away === squadraKey) return { avversario: match.home, isHome: false };
            }
            return { avversario: "-", isHome: false };
        }

        function changeModulo() {
            const moduloVal = document.getElementById('moduloSelect').value;
            localStorage.setItem('cascina_modulo', moduloVal);
            initCustomLineupSelectors();
        }

        function initCustomLineupSelectors() {
            const moduloVal = document.getElementById('moduloSelect').value;
            const parts = moduloVal.split('-');
            const difCount = parseInt(parts[0]);
            const cenCount = parseInt(parts[1]);
            const attCount = parseInt(parts[2]);

            const giornata = document.getElementById('giornataSelect') ? document.getElementById('giornataSelect').value : 12;
            const cascina = leagueData["CASCINA"] || {};
            let savedLineup = JSON.parse(localStorage.getItem('cascina_formazione') || "{}");

            const renderRow = (containerId, role, count, list) => {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';

                for (let i = 1; i <= count; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = "flex flex-col items-center bg-slate-900/95 p-2 rounded-lg border border-emerald-500/40 shadow-lg w-36 sm:w-40 backdrop-blur";

                    const label = document.createElement('span');
                    label.className = "text-[10px] font-extrabold text-amber-400 uppercase tracking-wider";
                    label.textContent = `${role} #${i}`;

                    // Sottoetichetta per la partita (Casa/Fuori vs Avversario)
                    const matchInfo = document.createElement('span');
                    matchInfo.className = "match-info text-[9px] text-slate-400 mb-1 font-medium";
                    matchInfo.textContent = "-";

                    const select = document.createElement('select');
                    select.className = "custom-player-select w-full bg-slate-800 text-white text-xs p-1 rounded border border-slate-600 focus:outline-none text-center font-semibold";
                    select.dataset.role = role;
                    select.dataset.index = i;
                    select.onchange = () => {
                        salvaFormazione();
                        aggiornaTuttiISelettori();
                        aggiornaInfoPartiteCampo();
                    };

                    const emptyOpt = document.createElement('option');
                    emptyOpt.value = "";
                    emptyOpt.textContent = "-- Seleziona --";
                    select.appendChild(emptyOpt);

                    (list || []).forEach((p) => {
                        const opt = document.createElement('option');
                        opt.value = p.name;
                        opt.textContent = `${p.name} (${p.squadra})`;
                        select.appendChild(opt);
                    });

                    const key = `${role}_${i}`;
                    if (savedLineup[key]) {
                        select.value = savedLineup[key];
                        // Calcola subito la partita se c'è un giocatore selezionato
                        let playerObj = (list || []).find(p => p.name === savedLineup[key]);
                        if (playerObj) {
                            const match = getMatchDetails(playerObj, giornata);
                            matchInfo.innerHTML = match.isHome ? `🏠 vs ${match.avversario}` : `✈️ @ ${match.avversario}`;
                            matchInfo.className = `match-info text-[9px] mb-1 font-medium ${match.isHome ? 'text-emerald-400' : 'text-amber-300'}`;
                        }
                    }

                    wrapper.appendChild(label);
                    wrapper.appendChild(matchInfo);
                    wrapper.appendChild(select);
                    container.appendChild(wrapper);
                }
            };

            renderRow('pitch-att', 'ATT', attCount, cascina.att);
            renderRow('pitch-cen', 'CEN', cenCount, cascina.cen);
            renderRow('pitch-dif', 'DIF', difCount, cascina.dif);
            renderRow('pitch-por', 'POR', 1, cascina.por);

            aggiornaTuttiISelettori();
        }

        function aggiornaInfoPartiteCampo() {
            const giornata = document.getElementById('giornataSelect').value || 12;
            const cascina = leagueData["CASCINA"] || {};
            
            document.querySelectorAll('.custom-player-select').forEach(sel => {
                const wrapper = sel.parentElement;
                const matchInfo = wrapper.querySelector('.match-info');
                if (!sel.value) {
                    matchInfo.textContent = "-";
                    matchInfo.className = "match-info text-[9px] text-slate-400 mb-1 font-medium";
                    return;
                }
                let roleKey = sel.dataset.role.toLowerCase();
                if(roleKey === 'por') roleKey = 'por';
                else if(roleKey === 'dif') roleKey = 'dif';
                else if(roleKey === 'cen') roleKey = 'cen';
                else if(roleKey === 'att') roleKey = 'att';

                let playerObj = (cascina[roleKey] || []).find(p => p.name === sel.value);
                if (playerObj) {
                    const match = getMatchDetails(playerObj, giornata);
                    matchInfo.innerHTML = match.isHome ? `🏠 vs ${match.avversario}` : `✈️ @ ${match.avversario}`;
                    matchInfo.className = `match-info text-[9px] mb-1 font-medium ${match.isHome ? 'text-emerald-400' : 'text-amber-300'}`;
                }
            });
        }

        function salvaFormazione() {
            const selects = document.querySelectorAll('.custom-player-select');
            let lineupToSave = {};
            selects.forEach((sel) => {
                lineupToSave[`${sel.dataset.role}_${sel.dataset.index}`] = sel.value;
            });
            localStorage.setItem('cascina_formazione', JSON.stringify(lineupToSave));
            updateCustomLineupStats();
        }

        function aggiornaTuttiISelettori() {
            const selects = document.querySelectorAll('.custom-player-select');
            let scelti = [];

            selects.forEach(sel => {
                if (sel.value) scelti.push(sel.value);
            });

            selects.forEach(sel => {
                const valoreCorrente = sel.value;
                for (let opt of sel.options) {
                    if (opt.value === "") continue;
                    if (scelti.includes(opt.value) && opt.value !== valoreCorrente) {
                        opt.disabled = true;
                        opt.style.color = "#64748b";
                    } else {
                        opt.disabled = false;
                        opt.style.color = "#f8fafc";
                    }
                }
            });

            updateCustomLineupStats();
        }

        function updateCustomLineupStats() {
            const selects = document.querySelectorAll('.custom-player-select');
            const cascina = leagueData["CASCINA"] || {};
            let selectedPlayers = [];
            
            selects.forEach(sel => {
                const name = sel.value;
                const role = sel.dataset.role;
                if (!name) return;
                
                let roleKey = role.toLowerCase() === 'por' ? 'por' : role.toLowerCase() === 'dif' ? 'dif' : role.toLowerCase() === 'cen' ? 'cen' : 'att';
                let playerObj = (cascina[roleKey] || []).find(p => p.name === name);
                
                if (playerObj) {
                    selectedPlayers.push({ mv: playerObj.mv, fm: playerObj.fm });
                }
            });

            let totalMv = selectedPlayers.reduce((acc, p) => acc + Number(p.mv), 0);
            let totalFm = selectedPlayers.reduce((acc, p) => acc + Number(p.fm), 0);
            const count = selectedPlayers.length || 1;

            const statsEl = document.getElementById('customLineupStats');
            if (statsEl) {
                statsEl.textContent = `Titolari: ${selectedPlayers.length}/11 | Media Voto: ${(totalMv/count).toFixed(2)} | Fantamedia: ${(totalFm/count).toFixed(2)}`;
            }
        }

        function renderTeam() {
            const giornataEl = document.getElementById('giornataSelect');
            const teamEl = document.getElementById('teamSelect');
            if (!giornataEl || !teamEl) return;

            const giornata = giornataEl.value || 12;
            const teamName = teamEl.value || "CASCINA";
            const team = leagueData[teamName];
            if (!team) return;
            
            document.getElementById('teamTitle').textContent = `Rosa Completa: ${teamName}`;
            const tbody = document.getElementById('rosterTable');
            tbody.innerHTML = '';

            const categories = [
                { role: 'POR', list: team.por || [], color: 'text-amber-400 font-bold' },
                { role: 'DIF', list: team.dif || [], color: 'text-blue-400 font-bold' },
                { role: 'CEN', list: team.cen || [], color: 'text-emerald-400 font-bold' },
                { role: 'ATT', list: team.att || [], color: 'text-rose-400 font-bold' }
            ];

            categories.forEach(cat => {
                cat.list.forEach(p => {
                    const match = getMatchDetails(p, giornata);
                    const homeAwayBadge = match.isHome ? '<span class="text-emerald-400 font-bold">🏠 Casa</span>' : '<span class="text-amber-400 font-bold">✈️ Fuori</span>';
                    
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-700/50 transition";
                    tr.innerHTML = `
                        <td class="p-3 ${cat.color}">${cat.role}</td>
                        <td class="p-3 font-semibold text-slate-200">${p.name}</td>
                        <td class="p-3 text-xs"><span class="text-slate-300 font-medium">${p.squadra}</span> <span class="text-slate-500 mx-1">→</span> ${homeAwayBadge} vs <span class="text-amber-300 font-semibold">${match.avversario}</span></td>
                        <td class="p-3 text-center text-slate-300 font-mono">${Number(p.mv).toFixed(2)}</td>
                        <td class="p-3 text-center text-emerald-400 font-mono font-bold">${Number(p.fm).toFixed(2)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            });

            // Aggiorna anche le etichette sul campo
            aggiornaInfoPartiteCampo();
        }

        loadData();
    </script>
</body>
</html>
