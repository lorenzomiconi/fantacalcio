name: Aggiornamento Giornaliero Fantacalcio

on:
  schedule:
    - cron: '0 5 * * *'  # Gira ogni giorno alle 06:00 in Italia
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Esegui lo script di aggiornamento
        run: python update.py

      - name: Salva le modifiche in automatico su GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aggiornamento automatico rose e news giornaliere 🤖"
